# custom_components/genesisenergy/services.yaml

add_powershout_booking:
  name: Add Power Shout Booking
  description: "Books a Genesis Energy Power Shout for your electricity account (future or past 31 days)."
  fields:
    start_datetime:
      name: Start Datetime
      description: "The date and time for the Power Shout to begin."
      required: true
      example: "2026-10-02 18:00:00"
      selector:
        datetime: {}
    duration_hours:
      name: Duration
      description: "The duration of the Power Shout in hours (1-4)."
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: slider
          unit_of_measurement: "hr"

cancel_powershout_booking:
  name: Cancel Power Shout Booking
  description: "Cancels an upcoming Power Shout booking."
  fields:
    booking_id:
      name: Booking ID
      description: "The unique ID of the booking to cancel."
      required: true
      example: "45f56a1fba641502ab8de46effdf933e"
      selector:
        text: {}

accept_powershout_offer:
  name: Accept Power Shout Offer
  description: "Accepts an available Power Shout campaign offer."
  fields:
    offer_id:
      name: Offer ID
      description: "The unique GUID/ID of the Power Shout offer to accept."
      required: true
      example: "12345678-abcd-1234-abcd-1234567890ab"
      selector:
        text: {}

backfill_statistics:
  name: Backfill Historical Statistics
  description: "Fetches historical usage data to backfill long-term statistics for the Energy Dashboard."
  fields:
    days_to_fetch:
      name: Days to Fetch
      description: "The total number of past days of data to retrieve."
      required: true
      example: 90
      selector:
        number:
          min: 1
          max: 730
          step: 1
          mode: box
    fuel_type:
      name: Fuel Type
      description: "Select which fuel type to backfill."
      required: true
      example: "both"
      selector:
        select:
          options:
            - "electricity"
            - "gas"
            - "both"
    force_overwrite:
      name: Force Overwrite
      description: "If enabled, re-fetches and overwrites existing statistics."
      required: true  
      example: false
      selector:
        boolean: {}

force_update:
  name: Force Data Update
  description: "Triggers an immediate poll of the Genesis Energy API for all sensors."
  fields:
    fuel_type:
      name: Fuel Type
      description: "Select which data to prioritize for refresh."
      required: true
      example: "both"
      selector:
        select:
          options:
            - "electricity"
            - "gas"
            - "both"
name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip integration directory
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/genesisenergy"
          zip genesisenergy.zip -r ./

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/custom_components/genesisenergy/genesisenergy.zip
